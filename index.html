<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="Kids math and typing games — race, pets, clocks, and Fox Rockets."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Kids Math Games</title>
    <script>
      (function () {
        var host = location.hostname
        if (host === 'braingames.dennymathgames.online' || host.indexOf('braingames.') === 0) {
          document.title = 'Brain Games'
        } else if (host === 'coding.dennymathgames.online' || host.indexOf('coding.') === 0) {
          document.title = 'Python Lab'
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
