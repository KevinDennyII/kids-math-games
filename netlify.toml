[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# SPA fallback so /race, /academy, /typing, /brain work on refresh
# coding. and braingames. dennymathgames.online share this publish dir; the app picks the site by hostname
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
