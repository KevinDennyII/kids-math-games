[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# SPA fallback so /race, /academy, /typing work on refresh
# coding.dennymathgames.online is the same publish dir; the app picks Python Lab by hostname
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
